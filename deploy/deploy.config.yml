# deploy/deploy.config.yml — per-environment deploy targets for mbdemo65-mock-backend.
#
# This is the single source of truth the Deploy workflow (.github/workflows/
# deploy.yml) reads at run time to decide WHERE each branch deploys. Edit a
# value here to retarget an environment — no workflow change needed.
#
#   target: local  -> runs on a self-hosted runner (e.g. your dev machine),
#                     docker compose up. develop uses this for the demo.
#   target: cloud  -> builds + pushes an image, then deploy/cloud/deploy.sh
#                     rolls it. uat/prod are gated by GitHub Environment
#                     required-reviewers (auto_deploy: false).
#
# Generated by the MothershipCode CI/CD hardener. See architecture/
# deploy-runbook.md for the self-hosted-runner setup and the demo runbook.
service:
  name: mbdemo65-mock-backend
  stack: spring-boot
  container_port: 8080
  health_path: /actuator/health
environments:
  develop:
    branch: develop
    target: local
    auto_deploy: true
    runs_on:
    - self-hosted
    - mbdemo65-mock-backend-dev
    method: docker-compose
    host_port: 8080
    compose_file: deploy/local/docker-compose.yml
    url: http://localhost:8080
    profile: develop
    env:
      ORCHESTRATION_CLIENT: mock
  qa:
    branch: qa
    target: cloud
    auto_deploy: true
    runs_on:
    - ubuntu-latest
    method: container
    url: https://mbdemo65-mock-backend-qa.example.com
    profile: qa
    env: {}
  uat:
    branch: uat
    target: cloud
    auto_deploy: false
    runs_on:
    - ubuntu-latest
    method: container
    url: https://mbdemo65-mock-backend-uat.example.com
    profile: uat
    env: {}
  prod:
    branch: main
    target: cloud
    auto_deploy: false
    runs_on:
    - ubuntu-latest
    method: container
    url: https://mbdemo65-mock-backend.example.com
    profile: prod
    env: {}
